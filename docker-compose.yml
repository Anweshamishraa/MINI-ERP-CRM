services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/erp?schema=public
      JWT_SECRET: change_me_in_production
      PORT: 5000
      NODE_ENV: development
    ports: ["5000:5000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
